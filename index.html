
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Periodic Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>3D Periodic Table</h1>
  <p>Explore all 118 chemical elements</p>

  <div class="controls">
    <input id="search" type="text"
      placeholder="Search name, symbol or number...">
    <button id="view">Flat View</button>
    <button id="reset">Reset</button>
  </div>

  <div class="wrapper" id="wrapper">
    <div id="table"></div>
  </div>

  <p class="help">
    Drag empty space to rotate · Scroll to zoom · Tap an element for details
  </p>

  <div id="details">
    Select an element to see its details.
  </div>

  <script src="script.js"></script>
</body>
</html>
