
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Periodic Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>3D Periodic Table</h1>
  <p>Explore all 118 chemical elements</p>

  <div class="controls">
    <input id="search" type="text"
      placeholder="Search element or atomic number...">
    <button id="viewBtn">Flat View</button>
    <button id="resetBtn">Reset View</button>
  </div>

  <div class="table-wrapper">
    <div id="periodicTable" class="periodic-table"></div>
  </div>

  <p id="message">Drag to rotate · Scroll or pinch to zoom</p>
  <div id="details">Select an element to see its details.</div>

  <script src="script.js"></script>
</body>
</html>
